spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/haru}
    username: ${DB_USERNAME:haru}
    password: ${DB_PASSWORD:haru}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:haru-local-dev-secret-key-change-this-in-production-32bytes-min}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:604800000}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

apple:
  bundle-id: ${APPLE_BUNDLE_ID:com.team5haru.harufrontend}
kakao:
  webhook:
    token: ${KAKAO_WEBHOOK_TOKEN:haru-local-dev-webhook-token}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
firebase:
  service-account-path: src/main/resources/firebase-service-account.json